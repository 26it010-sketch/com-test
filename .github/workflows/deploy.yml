name: Build and Deploy Document Manager

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build React frontend
        working-directory: frontend
        env:
          VITE_API_URL: /api
        run: npm run build

      - name: Prepare Nginx frontend files
        run: |
          mkdir -p nginx/dist
          rm -rf nginx/dist/*
          cp -r frontend/dist/. nginx/dist/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: ghcr.io/26it010-sketch/com-test-backend:latest

      - name: Build and push Nginx image
        uses: docker/build-push-action@v6
        with:
          context: ./nginx
          file: ./nginx/Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: ghcr.io/26it010-sketch/com-test-nginx:latest

      - name: Deploy containers to Ubuntu
        if: github.event_name == 'push'
        uses: appleboy/ssh-action@v1.2.0
        env:
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          envs: GHCR_USERNAME,GHCR_TOKEN,DATABASE_URL,SECRET_KEY
          script: |
            set -eu

            printf '%s' "$GHCR_TOKEN" | docker login ghcr.io \
              --username "$GHCR_USERNAME" --password-stdin

            docker pull ghcr.io/26it010-sketch/com-test-backend:latest
            docker pull ghcr.io/26it010-sketch/com-test-nginx:latest

            docker network inspect meena-network >/dev/null 2>&1 || \
            docker network create meena-network

            docker rm -f document-manager-nginx document-manager-backend 2>/dev/null || true

            docker run -d \
              --name document-manager-backend \
              --network meena-network \
              --restart unless-stopped \
              -e DATABASE_URL="$DATABASE_URL" \
              -e SECRET_KEY="$SECRET_KEY" \
              -e UPLOAD_DIR=/app/uploads \
              -v /home/ubuntu/meena/uploads:/app/uploads \
              ghcr.io/26it010-sketch/com-test-backend:latest

            docker run -d \
              --name document-manager-nginx \
              --network meena-network \
              --restart unless-stopped \
              -p 80:80 \
              ghcr.io/26it010-sketch/com-test-nginx:latest

            docker logout ghcr.io
            docker ps --filter name=document-manager
            docker logs --tail 50 document-manager-backend
            docker logs --tail 50 document-manager-nginx