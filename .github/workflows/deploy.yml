```
steps:
  - name: Checkout code
    uses: actions/checkout@v4

  - name: Set up Node.js
    uses: actions/setup-node@v4
    with:
      node-version: "22"
      cache: npm
      cache-dependency-path: frontend/package-lock.json

  - name: Install frontend dependencies
    working-directory: frontend
    run: npm ci

  - name: Build React frontend
    working-directory: frontend
    run: npm run build

  - name: Copy frontend build into backend
    run: |
      rm -rf backend/dist
      mkdir -p backend/dist
      cp -r frontend/dist/. backend/dist/

  - name: Set up Python
    uses: actions/setup-python@v5
    with:
      python-version: "3.11"

  - name: Check backend dependencies
    run: |
      python -m pip install --upgrade pip
      pip install -r backend/requirements.txt

  - name: Prepare deployment package
    run: |
      tar -czf deploy.tar.gz \
        --exclude='backend/.env' \
        --exclude='backend/__pycache__' \
        --exclude='backend/.venv' \
        --exclude='backend/uploads/*' \
        backend

  - name: Copy application to Ubuntu server
    if: github.event_name == 'push'
    uses: appleboy/scp-action@v0.1.7
    with:
      host: ${{ secrets.SERVER_HOST }}
      username: ${{ secrets.SERVER_USER }}
      key: ${{ secrets.SERVER_SSH_KEY }}
      source: deploy.tar.gz
      target: /home/${{ secrets.SERVER_USER }}/deployments/document-manager/

  - name: Deploy to Ubuntu server
    if: github.event_name == 'push'
    uses: appleboy/ssh-action@v1.2.0
    with:
      host: ${{ secrets.SERVER_HOST }}
      username: ${{ secrets.SERVER_USER }}
      key: ${{ secrets.SERVER_SSH_KEY }}
      script: |
        set -e

        APP_DIR="/home/${{ secrets.SERVER_USER }}/document-manager"
        DEPLOY_DIR="/home/${{ secrets.SERVER_USER }}/deployments/document-manager"

        mkdir -p "$APP_DIR"
        mkdir -p "$DEPLOY_DIR"

        tar -xzf "$DEPLOY_DIR/deploy.tar.gz" \
          -C "$DEPLOY_DIR"

        rsync -a --delete \
          --exclude='.env' \
          --exclude='uploads/' \
          "$DEPLOY_DIR/backend/" "$APP_DIR/"

        cd "$APP_DIR"

        if [ ! -d ".venv" ]; then
          python3 -m venv .venv
        fi

        .venv/bin/python -m pip install --upgrade pip
        .venv/bin/python -m pip install -r requirements.txt

        sudo systemctl restart document-manager

        sudo systemctl is-active --quiet document-manager

        echo "Deployment completed successfully."

